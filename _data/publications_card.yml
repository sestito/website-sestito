- title: >
    Reduced-order kinetic Monte Carlo model to simulate water diffusion in biodegradable polymers
    <br>"Journal Cover"
  type: Article
  img: 2022_kMC_Diff.png
  description:
  doi: 10.1016/j.commatsci.2021.111141
  year: 2022
  pdf_preprint: 2021_kMC_Hydro
  bibtex: |
    @article{SESTITO2022111141,
    title = {Reduced-order kinetic Monte Carlo model to simulate water diffusion in biodegradable polymers},
    journal = {Computational Materials Science},
    volume = {203},
    pages = {111141},
    year = {2022},
    issn = {0927-0256},
    doi = {https://doi.org/10.1016/j.commatsci.2021.111141},
    url = {https://www.sciencedirect.com/science/article/pii/S092702562100803X},
    author = {Jesse M. Sestito and Tequila A.L. Harris and Yan Wang},
    keywords = {Kinetic Monte Carlo, Dimensionality reduction, Water diffusion, Biodegradable polymeric scaffold},
    abstract = {Water is a driving factor in the degradation process of biodegradable polymers. However, water diffusion is typically not incorporated in the kinetic models of biodegradation such as kinetic Monte Carlo (kMC), because water diffusion events occur at a much shorter time scale than the hydrolysis reactions. As such, there is a need to improve the computational efficiency of water diffusion in the kMC models of diffusion processes in biodegradation. In this work, a new dimensionality reduction scheme for kMC diffusion models is developed to significantly reduce the computation time, where a two-dimensional kMC diffusion model for porous microstructures is reduced to one-dimensional ones. The dimensionality reduction is accomplished by calibrating the model parameters with multi-objective Bayesian optimization. The reduced-order diffusion model shows a 675-fold faster computation compared to the original two-dimensional model.}
    }
