- title: |
    An atomistic simulation study of nanoscale sintering: The role of grain boundary misorientation
  type: Article
  img: 2019_sintering.jpg
  description:
  doi: 10.1016/j.commatsci.2019.04.015
  year: 2019
  pdf:
  pdf_preprint: 2019_sintering_final
  bibtex: |
    @article{SESTITO2019180,
    title = {An atomistic simulation study of nanoscale sintering: The role of grain boundary misorientation},
    journal = {Computational Materials Science},
    volume = {165},
    pages = {180-189},
    year = {2019},
    issn = {0927-0256},
    doi = {https://doi.org/10.1016/j.commatsci.2019.04.015},
    url = {https://www.sciencedirect.com/science/article/pii/S0927025619302253},
    author = {Jesse M. Sestito and Fadi Abdeljawad and Tequila A.L. Harris and Yan Wang and Allen Roach},
    keywords = {Nanoscale sintering, Atomistic simulations, Grain boundary, Additive manufacturing},
    abstract = {Sintering is a processing technique used to produce bulk materials from powder compacts. Recently, sintering has been the subject of active research for its relevance to a wide range of applications, such as additive manufacturing and fabrication of bulk nanocrystalline materials. Of particular interest is the role of grain boundaries (GBs) on sintering mechanisms, cooperative mass transport, and pore shrinkage rates. Herein, atomistic simulations are leveraged to investigate sintering kinetics and densification rates of nanoscale particles as a function of GB misorientation. The two-particle geometry is used to examine particle neck growth rates and crystallographic re-orientation events, and report relative GB diffusion rates as a function of GB misorientation. For the three-particle configuration, simulation results reveal a plethora of pore shrinkage profiles ranging from complete shrinkage to stagnant response depending on the GBs present in the system. This is the first atomistic study that systematically examines the role of GB misorientation on pore shrinkage rates. Our results highlight the need to revisit continuum sintering treatments in order to account for the anisotropy in GB properties.}
    }
