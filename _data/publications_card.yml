- title: Structural descriptor and surrogate modeling for design of biodegradable scaffolds 
  type: Article
  img: 2024_Structural_Descriptor.png
  description:
  doi: doi.org/10.1016/j.jmbbm.2024.106415
  year: 2024
  pdf: 
  pdf_preprint: 2024_Structural_Descriptors
  bibtex: |
      @article{SESTITO2024106415,
      title = {Structural descriptor and surrogate modeling for design of biodegradable scaffolds},
      journal = {Journal of the Mechanical Behavior of Biomedical Materials},
      volume = {152},
      pages = {106415},
      year = {2024},
      issn = {1751-6161},
      doi = {https://doi.org/10.1016/j.jmbbm.2024.106415},
      url = {https://www.sciencedirect.com/science/article/pii/S175161612400047X},
      author = {Jesse M. Sestito and Tequila A.L. Harris and Yan Wang},
      keywords = {Structure-property relationship, Structural descriptor, Biodegradable scaffold, Kinetic Monte Carlo, Regenerative medicine},
      abstract = {Biodegradable scaffolds are important to regenerative medicine in that they provide an amicable environment for tissue regrowth. However, establishing structure-property (SP) relationships for scaffold design is challenging due to the complexity of the three-dimensional porous scaffold geometry. The complexity requires high-dimensional geometric descriptors. The training of such a SP surrogate model will need a large amount of experimental or simulation data. In this work, a schema of constructing SP relationship surrogates is developed to predict the degraded mechanical properties from the initial scaffold geometry. A new structure descriptor, the extended surfacelet transform (EST), is proposed to capture important details of pores associated with the degradation of scaffolds. The efficiency is further enhanced with principal component analysis to reduce the high-dimensional EST data into a low-dimensional representation. The schema also includes a kinetic Monte Carlo biodegradation model to simulate the biodegradation of polymer scaffolds and to generate the training data for the formation of SP relationships. The schema is demonstrated with the design of polycaprolactone biodegradable scaffolds by connecting the initial scaffold geometry to the degraded compressive modulus.}
      }

- title: Molecular dynamics simulations of cascade events in AlN
  type: Article
  img: 
  description:
  doi: doi.org/10.1016/j.rinma.2023.100383
  year: 2023
  #pdf: https://www.sciencedirect.com/science/article/pii/S2590048X23000213/pdfft?md5=51f0d5cd96bf2782b4917e69bc044e91&pid=1-s2.0-S2590048X23000213-main.pdf
  pdf_preprint: 2023_Cascade_AlN
  bibtex: |
      @article{KEMPNER2023100383,
      title = {Molecular dynamics simulations of cascade events in AlN},
      journal = {Results in Materials},
      pages = {100383},
      year = {2023},
      issn = {2590-048X},
      doi = {https://doi.org/10.1016/j.rinma.2023.100383},
      url = {https://www.sciencedirect.com/science/article/pii/S2590048X23000213},
      author = {Michaela Kempner and Jesse M. Sestito and Yan Wang and Eva Zarkadoula},
      keywords = {Molecular dynamics, Aluminum nitride, Radiation damage, Cascades},
      abstract = {The radiation tolerance and the ability to retain its piezoelectric response make aluminum nitride (AlN) a good candidate for emerging sensing technologies in nuclear reactor environments. Furthermore, it has been shown that doping the ceramic with additional metals can further improve the piezoelectric response. Fundamental understanding of the response of AlN to radiation is important for ultimately improving the material's properties. In this paper, we use molecular dynamics and a recently developed interatomic potential fitted to defect energies to investigate low energy collision cascades in AlN. We additionally investigate the electronic stopping effect in the damage production for 20 keV Al ions. Our results show that for all energies the number of Al surviving defects is larger than that of N defects. Additionally, we find that even though the ballistic energy loss is the dominating mechanism, it is important to take into account the electronic stopping in order not to overestimate the number of defects.}
      }

