
<figure class="img-cap {{ include.class }} {% if include.align != nil %}{{ include.align }}{% endif %}" style="{% if include.width != nil %}width:{{ include.width }};{% endif %} {% if include.minwidth != nil %}min-width:{{ include.minwidth }};{% endif %}">
    <img src="{{ include.url }}" alt="{{ include.description }}" class="img-responsive">
    {% if include.description != nil %}<figcaption class="caption">{{ include.description }}</figcaption>{% endif %}
</figure>
